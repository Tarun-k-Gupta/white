[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# zerobot's contracts compile with 0.8.27 + cancun and are live on Galileo.
# (solc 0.8.19 cannot target cancun; cancun needs >= 0.8.24.)
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
galileo = "https://evmrpc-testnet.0g.ai"
mainnet = "https://evmrpc.0g.ai"
local = "http://127.0.0.1:8545"

[etherscan]
galileo = { key = "${CHAINSCAN_API_KEY}", chain = 16602, url = "https://chainscan-galileo.0g.ai/open/api" }
mainnet = { key = "${CHAINSCAN_API_KEY}", chain = 16661, url = "https://chainscan.0g.ai/open/api" }
